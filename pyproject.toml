[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tdms-viewer"
dynamic = ["version"]
description = "Desktop viewer for STM I-t TDMS traces, local FFT analysis, blank comparison, and candidate screening."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {file = "LICENSE"}
authors = [{name = "TDMS Viewer contributors"}]
keywords = ["STM", "TDMS", "FFT", "signal-processing", "molecular-fingerprint"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.24",
  "nptdms>=1.8",
  "PySide6>=6.6",
  "pyqtgraph>=0.13",
  "matplotlib>=3.8",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
build = ["pyinstaller>=6.10", "Pillow>=10"]

[project.scripts]
tdms-viewer = "tdms_fingerprint_viewer.app:main"

[project.urls]
Homepage = "https://github.com/xiangjie208-art/tdms-viewer"
Issues = "https://github.com/xiangjie208-art/tdms-viewer/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "tdms_fingerprint_viewer.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
